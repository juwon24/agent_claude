name: Deploy Digital Core Simulator to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/digital-core-interactive-tool-01PKqCXsu3vfULhToVr89KPA
    paths:
      - 'digital_core_simulator/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './digital_core_simulator'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
